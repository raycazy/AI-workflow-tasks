<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nesa's Hemp: Find your ritual quiz (design prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NESA'S HEMP: "Find your ritual" quiz
   Design prototype. Brand surface. Not a Shopify build.

   Design system taken from the theme we are building,
   outputs/nesas-hemp/theme-boring-cro, NOT from the older
   brand-guide.md web substitutes. Sources:
     assets/nesa-global-fonts.css     Anton 400 + Nunito 400/600/700/800
     assets/nesa-home.css.liquid      .nesa-btn, .nesa-card
     config/settings_data.json        color_palette, radii
     sections/nesa-pdp-buybox.liquid  the Figma redesign token set
   ============================================================ */

:root{
  /* Exactly the buy box token set (Figma CRDdO76S8BAEXeggV2gHII) */
  --bg:#FFFFFF;
  --ink:#172620;        /* --d  primary ink, buttons, headings */
  --forest:#344C32;     /* --f  dark bands */
  --accent:#2F6B3F;     /* --a  check marks, positive marks */
  --soft:#4E6459;       /* --g  secondary text */
  --line:#DCD6CA;       /* --ln borders */
  --line-2:#E7E3DB;     /* the wider line token used across pdp sections */
  --tint-warm:#F6F1E8;       /* the buy box surface tint */
  --yellow:#FFDD00;     /* --y  save tab */
  --grey:#82958C;       /* --grey muted meta */
  --tint:#F2F2F0;       /* section ground */
  --mint:#95CFA5;       /* seal ring */

  --z-base:0; --z-sticky:10; --z-overlay:20; --z-tools:30;

  --display:"Anton",Impact,sans-serif;
  --body:"Nunito",ui-sans-serif,-apple-system,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- Display type ----------
   Anton ships ONE weight. Every display rule pins font-weight:400 so the
   browser never synthesises a bold from it. Nunito 800 carries real bold. */
.display{
  font-family:var(--display);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:-.005em;
  line-height:1.08;
  margin:0;
  color:var(--ink);
  text-wrap:balance;
}

/* Kicker: Nunito 800, .16em tracking. The theme's own section eyebrow. */
.kicker{
  font-family:var(--body);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:14px;
  line-height:1.6;
  color:var(--soft);
  margin:0;
}
.label{
  font-family:var(--body);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:12px;
  line-height:1.6;
  color:var(--soft);
}

/* ============================================================
   SHELL
   ============================================================ */
.app{
  display:grid;
  grid-template-columns:400px 1fr;
  min-height:100vh;
  /* Paints the rail column full height so a long results page has no
     seam under the sticky rail. */
  background:linear-gradient(90deg,var(--forest) 0 400px,var(--bg) 400px);
}

/* ---------- Left rail (desktop) ---------- */
.rail{
  position:sticky;
  top:0;
  height:100vh;
  background:var(--forest);
  color:#fff;
  padding:40px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:32px;
  overflow:hidden;
}
.rail__photo{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  opacity:.72;
  transition:opacity 480ms ease, background-image 480ms ease;
}
.rail__veil{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(52,76,50,.48) 0%,rgba(52,76,50,.80) 46%,rgba(23,38,32,.94) 100%);
}
/* Only the content layers get lifted. The photo and veil stay absolute,
   so scoping this beats a blanket `.rail > *`. */
.rail__mark,.rail__section,.rail__foot{position:relative;z-index:var(--z-sticky)}

.rail__mark img{width:112px;filter:brightness(0) invert(1);opacity:.94}

.rail__section .label{color:rgba(255,255,255,.72)}
.rail__section h2{
  font-family:var(--display);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:-.005em;
  font-size:24px;
  line-height:1.16;
  margin:12px 0 0;
  color:#fff;
  max-width:16ch;
}

.rail__foot{display:flex;flex-direction:column;gap:12px}
.track{
  height:4px;
  width:100%;
  border-radius:999px;
  background:rgba(255,255,255,.22);
  overflow:hidden;
}
.track__fill{
  display:block;
  height:100%;
  width:0;
  border-radius:999px;
  background:var(--yellow);
  transition:width 420ms cubic-bezier(.23,1,.32,1);
}
.rail__meta{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  font-family:var(--body);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:12px;
  color:rgba(255,255,255,.72);
}

/* ---------- Right stage ---------- */
.stage{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding:32px 40px 48px;
}
.stage__top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-height:32px;
}
.back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:0;
  background:none;
  padding:8px 0;
  font-family:var(--body);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:12px;
  color:var(--soft);
  position:relative;
}
.back::before{content:"";position:absolute;inset:-10px}
.back:hover{color:var(--ink)}
.back[hidden]{display:none}
.stage__count{font-size:14px;color:var(--soft);margin:0}

.stage__body{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:40px 0;
}
.panel{
  width:100%;
  max-width:600px;
  margin:0 auto;
}

/* ============================================================
   QUESTIONS
   Question headings sit in Nunito, not Anton. The theme does the same:
   nesa-home.css sets every h1 to h6 inside a Nesa section to Nunito
   unless it opts into .nesa-serif, and twelve screens of Anton capitals
   would be exhausting to read.
   ============================================================ */
.q__head{
  font-family:var(--body);
  font-weight:800;
  font-size:clamp(24px,2.6vw,28px);
  line-height:1.24;
  letter-spacing:-.01em;
  margin:0;
  color:var(--ink);
  max-width:24ch;
  text-wrap:balance;
}
.q__hint{
  margin:12px 0 0;
  font-size:16px;
  line-height:1.56;
  color:var(--soft);
  max-width:52ch;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:32px 0 0;
  padding:0;
  list-style:none;
}
.options--grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:12px;
}

/* Selectable card: the buy box tier. 1px --ln, radius 14, and the
   selected state draws a 2px inward stroke so nothing shifts. */
.opt{
  width:100%;
  min-height:60px;
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px 20px;
  text-align:left;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:14px;
  font-family:var(--body);
  font-weight:600;
  font-size:16px;
  line-height:1.4;
  color:var(--ink);
  transition:border-color 160ms cubic-bezier(.23,1,.32,1),box-shadow 160ms cubic-bezier(.23,1,.32,1),transform 160ms cubic-bezier(.23,1,.32,1);
}
.opt:hover{border-color:var(--ink);transform:translateY(-2px)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt[aria-pressed="true"]{
  border-color:var(--ink);
  box-shadow:inset 0 0 0 2px var(--ink);
}
/* The buy box radio: 20px ring, 10px ink centre when chosen. */
.opt__dot{
  flex:none;
  width:20px;
  height:20px;
  border-radius:50%;
  border:1px solid var(--grey);
  display:grid;
  place-items:center;
}
.opt[aria-pressed="true"] .opt__dot{border-color:var(--ink)}
.opt[aria-pressed="true"] .opt__dot::after{
  content:"";
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--ink);
}
/* Multi select uses the perk tick, stroked in the theme's accent green. */
.opt__tick{
  flex:none;
  width:20px;
  height:20px;
  fill:none;
  stroke:var(--grey);
  stroke-width:2.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.opt[aria-pressed="true"] .opt__tick{stroke:var(--accent)}
.opt__txt{flex:1;min-width:0}

.why{
  margin:40px 0 0;
  padding:24px 0 0;
  border-top:1px solid var(--line);
  max-width:56ch;
}
.why p{margin:10px 0 0;font-size:16px;line-height:1.56;color:var(--soft)}

/* ---------- Primary action ----------
   .nesa-btn from the theme: 58px ink pill, Anton 20, radius 999,
   lifts 2px on hover with no shadow. */
.cta{
  width:100%;
  min-height:58px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:0 40px;
  border:0;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  font-family:var(--display);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.6px;
  font-size:20px;
  line-height:1;
  transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease;
}
.cta:hover{transform:translateY(-2px)}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.cta[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.cta--quiet{
  background:transparent;
  color:var(--ink);
  border:2px solid var(--line);
  font-size:18px;
}
.cta--quiet:hover{border-color:var(--ink)}
.actions{margin:32px 0 0;display:flex;flex-direction:column;gap:12px}

/* ============================================================
   INTRO
   ============================================================ */
.intro__display{font-size:clamp(40px,5.4vw,64px)}
.intro__sub{margin:24px 0 0;font-size:18px;line-height:1.62;color:var(--soft);max-width:50ch}
.intro__meta{margin:24px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pill{
  display:inline-flex;
  align-items:center;
  height:40px;
  padding:0 18px;
  border:2px solid var(--line);
  border-radius:999px;
  font-family:var(--display);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.6px;
  font-size:14px;
  color:var(--ink);
}
.certs{
  margin:32px 0 0;
  padding:24px 0 0;
  border-top:1px solid var(--line);
}
.certs__row{
  margin:14px 0 0;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:20px;
}
.certs__row img{height:44px;width:auto}

/* ============================================================
   INTERSTITIALS
   ============================================================ */
/* The image stands on its own, no frame. Radius 20 matches the buy box
   gallery stage. */
.figure{
  position:relative;
  aspect-ratio:16/10;
  background-size:cover;
  background-position:center;
  background-color:var(--tint-warm);
  border-radius:20px;
  overflow:hidden;
}
/* Square variant, for the portrait source on the ritual screen. */
.figure--square{aspect-ratio:1/1}
.figure__veil{
  position:absolute;
  inset:0;
  /* Weighted to the lower third: these photos are bright at the bottom
     (a pale label, a sunlit shoulder) and the stat sits in white there. */
  background:linear-gradient(180deg,rgba(23,38,32,0) 0%,rgba(23,38,32,.18) 42%,rgba(23,38,32,.72) 68%,rgba(23,38,32,.94) 100%);
}
.figure__stat{
  position:absolute;
  left:28px;
  right:28px;
  bottom:24px;
  color:#fff;
}
.figure__stat .big{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(48px,7vw,72px);
  line-height:1;
  letter-spacing:-.005em;
  display:block;
}
.figure__stat .cap{margin:8px 0 0;font-size:16px;line-height:1.5;max-width:34ch}
.footnote{margin:16px 0 0;font-size:12px;line-height:1.6;color:var(--grey)}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:32px 0 0;
}
.stat{
  background:var(--tint-warm);
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px 20px;
}
.stat b{
  display:block;
  font-family:var(--display);
  font-weight:400;
  font-size:40px;
  line-height:1;
  color:var(--ink);
}
.stat span{display:block;margin:10px 0 0;font-size:14px;line-height:1.44;color:var(--soft)}

.honest{
  margin:24px 0 0;
  padding:24px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--tint-warm);
}
.honest p{margin:10px 0 0;font-size:16px;line-height:1.56;color:var(--ink)}

/* ============================================================
   TEXT INPUT
   ============================================================ */
.field{margin:32px 0 0}
.field input{
  width:100%;
  min-height:60px;
  padding:16px 22px;
  background:var(--bg);
  border:2px solid var(--line);
  border-radius:999px;
  font-family:var(--body);
  font-weight:600;
  font-size:16px;
  color:var(--ink);
}
.field input::placeholder{color:var(--grey);opacity:1}
.field input:focus{outline:0;border-color:var(--ink)}
.consent{margin:16px 0 0;font-size:14px;line-height:1.56;color:var(--soft);max-width:52ch}
.consent a{color:var(--ink)}

/* ============================================================
   CALCULATING
   ============================================================ */
.calc__list{margin:40px 0 0;display:flex;flex-direction:column;gap:28px}
.calc__row b{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(40px,6vw,64px);
  line-height:1;
  color:var(--ink);
  display:block;
}
.calc__row span{display:block;margin:8px 0 0;font-size:16px;line-height:1.5;color:var(--soft);max-width:44ch}

/* ============================================================
   RESULTS SCORECARD
   ============================================================ */
.score{
  margin:32px 0 0;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  background:var(--bg);
}
.score__row{
  display:block;
  width:100%;
  text-align:left;
  padding:20px;
  background:none;
  border:0;
  border-top:1px solid var(--line);
}
.score__row:first-child{border-top:0}
.score__row:hover{background:var(--tint-warm)}
.score__head{display:flex;align-items:center;gap:16px}
.score__name{
  flex:0 0 132px;
  font-family:var(--body);
  font-weight:700;
  font-size:16px;
  color:var(--ink);
}
.score__bar{
  display:block;
  flex:1;
  height:8px;
  border-radius:999px;
  background:var(--line);
  overflow:hidden;
}
.score__fill{
  display:block;
  height:100%;
  width:0;
  background:var(--forest);
  border-radius:999px;
  transition:width 720ms cubic-bezier(.22,.61,.36,1);
}
/* Focus rides the theme's yellow save tab. Steady stays quiet. */
.score__tag{
  flex:none;
  font-family:var(--body);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.84px;
  font-size:12px;
  line-height:25px;
  height:25px;
  padding:0 8px;
  border-radius:5px;
  color:var(--grey);
}
.score__tag--focus{background:var(--yellow);color:var(--ink)}
.score__note{
  margin:14px 0 0 148px;
  font-size:16px;
  line-height:1.56;
  color:var(--soft);
  max-width:52ch;
}
.score__note[hidden]{display:none}
@media (max-width:640px){
  .score__name{flex-basis:92px;font-size:14px}
  .score__note{margin-left:0}
}

/* ============================================================
   RECOMMENDATION
   ============================================================ */
.rec__head{font-size:clamp(32px,4.4vw,46px);margin:10px 0 0}
.rec__lede{margin:20px 0 0;font-size:18px;line-height:1.62;color:var(--soft);max-width:52ch}

.buy{
  margin:32px 0 0;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--bg);
  overflow:hidden;
}
.buy__items{display:flex;flex-direction:column}
.buy__item{
  display:flex;
  gap:20px;
  align-items:center;
  padding:20px;
  border-top:1px solid var(--line);
}
.buy__item:first-child{border-top:0}
.buy__item img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:6px;
  flex:none;
  background:var(--tint-warm);
}
.buy__copy{flex:1;min-width:0}
.buy__copy h4{
  margin:0;
  font-family:var(--display);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:-.005em;
  font-size:20px;
  line-height:1.2;
  color:var(--ink);
}
.buy__copy p{margin:6px 0 0;font-size:14px;line-height:1.42;color:var(--soft)}
/* CBDa is a molecule name, so the lowercase a has to survive an uppercase
   heading. text-transform cannot except a substring, so the theme wraps
   those four letters in this class and so do we. */
.nocaps{text-transform:none}
.buy__price{
  flex:none;
  font-family:var(--display);
  font-weight:400;
  font-size:20px;
  line-height:1.5;
  color:var(--ink);
}

.plans{display:flex;flex-direction:column;gap:15px;padding:20px;border-top:1px solid var(--line)}
.plan{
  position:relative;
  display:flex;
  align-items:center;
  gap:15px;
  padding:18px 20px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--bg);
  text-align:left;
  transition:border-color 160ms cubic-bezier(.23,1,.32,1),box-shadow 160ms cubic-bezier(.23,1,.32,1);
}
.plan[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.plan__radio{
  flex:none;
  width:20px;height:20px;
  border:1px solid var(--grey);
  border-radius:50%;
  display:grid;
  place-items:center;
}
.plan[aria-pressed="true"] .plan__radio{border-color:var(--ink)}
.plan[aria-pressed="true"] .plan__radio::after{
  content:"";
  width:10px;height:10px;
  border-radius:50%;
  background:var(--ink);
}
.plan__copy{flex:1;min-width:0}
.plan__copy b{
  display:block;
  font-family:var(--display);
  font-weight:400;
  text-transform:uppercase;
  font-size:18px;
  line-height:1.32;
  color:var(--ink);
}
.plan__copy span{display:block;font-size:14px;line-height:1.42;color:var(--soft);margin:2px 0 0}
.plan__cost{
  flex:none;
  text-align:right;
  font-family:var(--display);
  font-weight:400;
  font-size:20px;
  line-height:1.5;
  color:var(--ink);
}
/* The yellow save tab, sitting on the card's top edge exactly as the
   buy box tier does. */
.plan__save{
  position:absolute;
  left:20px;
  bottom:100%;
  margin-bottom:-12px;
  height:25px;
  padding:0 8px;
  border-radius:5px;
  background:var(--yellow);
  color:var(--ink);
  font-family:var(--body);
  font-weight:800;
  font-size:14px;
  line-height:25px;
  letter-spacing:.84px;
  text-transform:uppercase;
}
.plan--saver{margin-top:20px}

.protocol{margin:32px 0 0;padding:24px 0 0;border-top:1px solid var(--line)}
.protocol ol{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px}
.protocol li{position:relative;padding:0 0 0 37px;font-size:16px;line-height:1.56;color:var(--soft)}
/* The pdp timeline node: an 18px forest disc with a 7px light centre. */
.protocol li::before{
  content:"";
  position:absolute;
  left:0;top:5px;
  width:18px;height:18px;
  border-radius:50%;
  background:var(--forest);
}
.protocol li::after{
  content:"";
  position:absolute;
  left:6px;top:11px;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--mint);
}
.protocol li b{font-weight:800;color:var(--ink)}

.trust{margin:32px 0 0;padding:24px 0 0;border-top:1px solid var(--line)}
.disclaimer{
  margin:32px 0 0;
  padding:20px 0 0;
  border-top:1px solid var(--line);
  font-size:12px;
  line-height:1.66;
  color:var(--grey);
}

/* ============================================================
   PROTOTYPE REVIEW TOOLBAR (mockup only, not part of the design)
   ============================================================ */
.tools{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:var(--z-tools);
  font-family:var(--body);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:12px;
}
.tools__toggle{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:12px 16px;
  border:0;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
}
.tools__panel{
  display:none;
  margin:8px 0 0;
  width:272px;
  max-height:60vh;
  overflow:auto;
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--bg);
  box-shadow:0 14px 30px rgba(23,38,32,.12);
}
.tools__panel[data-open="true"]{display:block}
.tools__panel button{
  display:block;
  width:100%;
  text-align:left;
  padding:8px 10px;
  border:0;
  border-radius:6px;
  background:none;

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .rail{
    position:sticky;
    top:0;
    height:auto;
    min-height:0;
    flex-direction:row;

@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms !important;transition-duration:1ms !important}
}

<body>

<div class="app">

  <!-- =========================== LEFT RAIL =========================== -->
  <aside class="rail on-dark">
    <div class="rail__photo" id="railPhoto"></div>

</div>

<!-- Prototype review controls: not part of the shipped design -->
<div class="tools">

    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1.5 3h9M1.5 6h9M1.5 9h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    Screens
  </button>
</div>

<script>
/* ============================================================
   DATA
   Every product fact below is verified against the live Shopify
   catalogue and the client's official brand guidelines PDF.
   Nothing here is invented. See README.md for sources.
   ============================================================ */

const PRODUCTS = {
  oil: {
    name: "Certified Organic CBDa Hemp Extract",
    meta: "1000mg, 1 FL OZ (30ml), 60 servings",
    price: 134.99,
    // Verified subscribe and save price from the 2026 CRO audit.
    sub: 99.99,
    img: "assets/oil-1000mg.png"
  },
  powder: {
    name: "Certified Organic Full Spectrum Nutrition Powder with B17",
    meta: "1 lb pouch, blends into food or a drink",
    price: 89.99,
    // PLACEHOLDER: no published subscribe price exists for the powder.
    // Confirm with the client before this ships. See README.md.
    sub: 74.99,
    img: "assets/powder-b17.jpg"
  }
};

/* Rail lines are set in Anton capitals, so they stay short. */
const RAIL = {
  basics:  { label:"The basics",  line:"Nature's solution in its purest form",   photo:"assets/rail-outdoor.jpg" },
  days:    { label:"Your days",   line:"We ask how you live, never for a diagnosis", photo:"assets/rail-field.jpg" },
  ritual:  { label:"Your ritual", line:"The routine matters more than the bottle",   photo:"assets/rail-ritual.jpg" },
  results: { label:"Your match",  line:"Three ingredients. Fourteen lab tests.",     photo:"assets/rail-nutrition.jpg" }
};

/* Questions. Options are capped at five so no single screen
   asks for more than one easy decision. */
const QUESTIONS = [
  {
    id:"age", section:"basics",
    head:"How old are you?",
    options:[
      {v:"18-25",t:"18 to 25"},
      {v:"26-34",t:"26 to 34"},
      {v:"35-44",t:"35 to 44"},
      {v:"45-60",t:"45 to 60"},
      {v:"60+",t:"Over 60"}
    ]
  },
  {
    id:"goal", section:"basics",
    head:"What brought you to Nesa's today?",
    options:[
      {v:"comfort",t:"Ease the everyday aches"},
      {v:"sleep",t:"Sleep through the night"},
      {v:"recovery",t:"Recover faster after training"},
      {v:"stress",t:"Steady my everyday stress"},
      {v:"nutrition",t:"Fill the gaps in what I eat"}
    ]
  },
  { interstitial:"proof", section:"basics" },
  {
    id:"areas", section:"days", multi:true, grid:true,
    head:"Which of these would you like to support?",
    hint:"Pick as many as apply.",
    options:[
      {v:"comfort",t:"Everyday comfort"},
      {v:"sleep",t:"Deeper sleep"},
      {v:"recovery",t:"Recovery after effort"},
      {v:"mood",t:"A steady mood"},
      {v:"nutrition",t:"Daily nutrition"},
      {v:"focus",t:"Focus through the afternoon"}
    ]
  },
  {
    id:"day", section:"days",
    head:"What does a normal day ask of your body?",
    why:"Load changes what your routine has to hold up against. A day spent seated and a day spent lifting need different timing, not different promises.",
    options:[
      {v:"desk",t:"Mostly seated, at a desk"},
      {v:"feet",t:"On my feet most of the day"},
      {v:"physical",t:"Physical work or heavy lifting"},
      {v:"varies",t:"It changes week to week"}
    ]
  },
  {
    id:"training", section:"days",
    head:"How often do you train or move on purpose?",
    options:[
      {v:"rare",t:"Rarely"},
      {v:"1-2",t:"Once or twice a week"},
      {v:"3-4",t:"Three or four times a week"},
      {v:"5+",t:"Five or more times a week"}
    ]
  },
  {
    id:"sleep", section:"days",
    head:"How do you sleep on a normal night?",
    why:"Sleep is where we place the second serving. If you wake in the night, we move your evening dose earlier rather than raising the amount.",
    options:[
      {v:"through",t:"I sleep straight through"},
      {v:"waking",t:"I wake once or twice"},
      {v:"falling",t:"I struggle to fall asleep"},
      {v:"varies",t:"It changes night to night"}
    ]
  },
  {
    id:"timing", section:"days",
    head:"When in the day do you notice it most?",
    why:"This sets where your two servings land. We move them toward the hours that matter to you rather than raising the amount.",
    options:[
      {v:"morning",t:"First thing in the morning"},
      {v:"afternoon",t:"The afternoon dip"},
      {v:"evening",t:"In the evening, once I stop"},
      {v:"even",t:"It is fairly even through the day"}
    ]
  },
  {
    id:"diet", section:"days",
    head:"In a normal week, what does most of your food look like?",
    options:[
      {v:"whole",t:"Home cooked, plenty of plants"},
      {v:"mixed",t:"A mix of home cooked and takeout"},
      {v:"quick",t:"Mostly quick and convenient"},
      {v:"skipping",t:"I skip meals more often than I should"}
    ]
  },
  { interstitial:"purity", section:"days" },
  {
    id:"experience", section:"ritual",
    head:"Have you taken hemp or CBD before?",
    options:[
      {v:"never",t:"Never"},
      {v:"nothing",t:"I tried it and felt nothing"},
      {v:"current",t:"I take something now"},
      {v:"lapsed",t:"I used to, then stopped"}
    ]
  },
  {
    id:"shortfall", section:"ritual",
    showIf:(a)=>a.experience==="nothing"||a.experience==="lapsed",
    head:"What made it fall short?",
    why:"Most hemp that disappoints was either underdosed or taken inconsistently. Knowing which one it was changes what we suggest.",
    options:[
      {v:"noeffect",t:"I never felt a difference"},
      {v:"taste",t:"The taste"},
      {v:"price",t:"The price"},
      {v:"consistency",t:"I could not stay consistent"}
    ]
  },
  {
    id:"format", section:"ritual",
    head:"How would you rather take it every day?",
    options:[
      {v:"drops",t:"Drops under the tongue"},
      {v:"blend",t:"Blended into food or a drink"},
      {v:"either",t:"Either works for me"}
    ]
  },
  {
    id:"caffeine", section:"ritual",
    head:"How much caffeine is in a normal day?",
    options:[
      {v:"none",t:"None"},
      {v:"one",t:"One cup"},
      {v:"two-three",t:"Two or three cups"},
      {v:"four+",t:"Four or more"}
    ]
  },
  {
    id:"consistency", section:"ritual",
    head:"How consistent are you with a daily routine?",
    why:"One bottle holds 60 servings, which is about 30 days at half a dropper twice daily. If your honest answer is hit or miss, we send a smaller commitment first.",
    options:[
      {v:"never-miss",t:"I never miss"},
      {v:"most-days",t:"Most days"},
      {v:"hit-miss",t:"Hit or miss"},
      {v:"forget",t:"I forget unless it is in front of me"}
    ]
  },
  { interstitial:"ritual", section:"ritual" }
];

/* Full screen order */
const SCREENS = [
  {type:"intro", section:"basics", title:"Intro"},
  {type:"consent", section:"basics", title:"Compliance notice"},
  ...QUESTIONS.map(q => q.interstitial
    ? {type:"interstitial", key:q.interstitial, section:q.section, title:"Interstitial: "+q.interstitial}
    : {type:"question", id:q.id, section:q.section, title:"Q: "+q.head.replace(/\?$/,"")}),
  {type:"name", section:"ritual", title:"First name"},
  {type:"email", section:"ritual", title:"Email"},
  {type:"calculating", section:"results", title:"Calculating"},
  {type:"results", section:"results", title:"Results scorecard"},
  {type:"recommendation", section:"results", title:"Recommendation"}
];

/* ============================================================
   STATE
   ============================================================ */
const state = { i:0, answers:{}, name:"", email:"", plan:"subscribe" };

const el = (id) => document.getElementById(id);
const panel = el("panel");

function questionById(id){ return QUESTIONS.find(q => q.id === id); }

function isVisible(screen){
  if(screen.type !== "question") return true;
  const q = questionById(screen.id);
  return !q.showIf || q.showIf(state.answers);
}

function visibleScreens(){ return SCREENS.filter(isVisible); }

function answeredCount(){
  return visibleScreens().filter(s => s.type === "question" && state.answers[s.id] != null).length;
}
function totalQuestions(){
  return visibleScreens().filter(s => s.type === "question").length;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function go(delta){
  const list = visibleScreens();
  const current = list[state.i];
  let next = state.i + delta;
  next = Math.max(0, Math.min(list.length - 1, next));
  state.i = next;
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

function jumpTo(index){ state.i = index; render(); }

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const list = visibleScreens();
  state.i = Math.min(state.i, list.length - 1);
  const screen = list[state.i];

  // Rail
  const rail = RAIL[screen.section] || RAIL.basics;
  el("railLabel").textContent = rail.label;
  el("railLine").textContent = rail.line;
  el("railPhoto").style.backgroundImage = `url("${rail.photo}")`;

  const pct = Math.round((state.i / (list.length - 1)) * 100);
  const done = screen.type === "results" || screen.type === "recommendation";
  el("trackFill").style.width = (done ? 100 : pct) + "%";
  el("progressPct").textContent = done ? "Complete" : pct + "%";
  // The question counter lives in the stage header, so the rail carries
  // the section name instead of repeating it.
  el("progressStep").textContent = done ? "" : rail.label;

  el("backBtn").hidden = state.i === 0;
  el("stageCount").textContent = screen.type === "question"
    ? `Question ${answeredIndex(screen.id)} of ${totalQuestions()}`
    : "";

  panel.innerHTML = "";
  panel.appendChild(viewFor(screen));
  buildTools();
}

function answeredIndex(id){
  const qs = visibleScreens().filter(s => s.type === "question");
  return qs.findIndex(s => s.id === id) + 1;
}

function frag(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content;
}

function viewFor(screen){
  switch(screen.type){
    case "intro": return viewIntro();
    case "consent": return viewConsent();
    case "question": return viewQuestion(questionById(screen.id));
    case "interstitial": return viewInterstitial(screen.key);
    case "name": return viewName();
    case "email": return viewEmail();
    case "calculating": return viewCalculating();
    case "results": return viewResults();
    case "recommendation": return viewRecommendation();
  }
}

/* ---------- Intro ---------- */
function viewIntro(){
  const f = frag(`
    <div>
      <h1 class="display intro__display">Find the ritual that fits your day</h1>
      <p class="intro__sub">Twelve questions about how you move, sleep and eat. We match you to the product, the dose and the cadence that suit your week, then explain why.</p>
      <div class="intro__meta">
        <span class="pill">3 min</span>
        <span class="pill">12 questions</span>
      </div>
      <div class="actions"><button class="cta" data-next>Start with the basics</button></div>
      <div class="certs">
        <p class="label">Certified on every batch</p>
        <div class="certs__row">
          <img src="assets/certs/usda-organic.png" alt="USDA Organic">
          <img src="assets/certs/mosa.png" alt="MOSA Certified Organic">

        </div>

}

/* ---------- Compliance ---------- */
function viewConsent(){
  return frag(`
    <div>
      <h2 class="q__head">Before we start</h2>
      <p class="q__hint">This quiz gives a wellness recommendation based on your answers. It is not medical advice, and it is not intended to diagnose, treat, cure or prevent any disease.</p>
      <p class="q__hint">We do not ask about diagnoses or medications. If you take prescription medication or you are pregnant, speak with your doctor before adding any hemp product.</p>
      <p class="q__hint">By continuing you agree to our <a href="#" style="color:var(--ink)">Terms</a> and <a href="#" style="color:var(--ink)">Privacy Policy</a>.</p>
      <div class="actions"><button class="cta" data-next>I understand</button></div>
    </div>`);
}

/* ---------- Question ---------- */
function viewQuestion(q){
  const selected = state.answers[q.id];
  const wrap = document.createElement("div");

  wrap.appendChild(frag(`
    <h2 class="q__head">${q.head}</h2>
    ${q.hint ? `<p class="q__hint">${q.hint}</p>` : ""}
  `));

  const list = document.createElement("div");
  list.className = "options" + (q.grid ? " options--grid" : "");

  q.options.forEach(o => {
    const on = q.multi
      ? Array.isArray(selected) && selected.includes(o.v)
      : selected === o.v;

    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.setAttribute("aria-pressed", on ? "true" : "false");
    // Single select gets the buy box radio, multi select gets the perk tick.
    b.innerHTML = (q.multi
      ? `<svg class="opt__tick" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5 8 14.5l8-9"/></svg>`
      : `<span class="opt__dot"></span>`)
      + `<span class="opt__txt">${o.t}</span>`;

    b.addEventListener("click", () => {
      if(q.multi){
        const cur = Array.isArray(state.answers[q.id]) ? [...state.answers[q.id]] : [];
        const at = cur.indexOf(o.v);
        if(at > -1) cur.splice(at,1); else cur.push(o.v);
        state.answers[q.id] = cur;
        render();
      } else {
        state.answers[q.id] = o.v;
        // Single select advances on its own, the way Thesis does.
        setTimeout(() => go(1), 160);
        render();
      }
    });
    list.appendChild(b);
  });
  wrap.appendChild(list);

  if(q.multi){
    const picked = Array.isArray(selected) && selected.length > 0;
    const act = frag(`<div class="actions"><button class="cta" data-next ${picked ? "" : "disabled"}>Next</button></div>`);
    wrap.appendChild(act);
  }

  if(q.why){
    wrap.appendChild(frag(`
      <div class="why">
        <p class="label">Why we ask</p>
        <p>${q.why}</p>
      </div>`));
  }
  return wrap;
}

/* ---------- Interstitials ----------
   Every figure carries only claims we can source. No study is cited
   that we have not read, and no population average is invented. */
function viewInterstitial(key){
  if(key === "proof"){
    return frag(`
      <div>
        <p class="kicker">One bottle, one month</p>
        <h2 class="display" style="font-size:clamp(32px,4.4vw,46px);margin-top:10px">Sixty servings, and we count them honestly</h2>

        <div class="figure" style="background-image:url('assets/rail-outdoor.jpg');margin:32px 0 0">
          <div class="figure__veil"></div>
          <div class="figure__stat">
            <span class="big">4.9</span>
            <p class="cap">across 328 reviews on our own store</p>
          </div>
        </div>
        <div class="actions"><button class="cta" data-next>Next</button></div>

  }

  if(key === "purity"){
    return frag(`
      <div>
        <p class="kicker">What is actually in it</p>
        <h2 class="display" style="font-size:clamp(32px,4.4vw,46px);margin-top:10px">Three ingredients, fourteen lab tests</h2>
        <p class="q__hint">Organic hemp seeds, organic hemp, organic sunflower seeds. That is the whole label.</p>
        <div class="stats">
          <div class="stat"><b>14</b><span>third party lab tests on every batch, from potency to heavy metals</span></div>
          <div class="stat"><b>7</b><span>certifications carried on the bottle, including USDA Organic and Kosher</span></div>
          <div class="stat"><b>3</b><span>ingredients, with a QR code on each batch that opens its own results</span></div>
        </div>
        <div class="honest">
          <p class="label">One thing we should clear up</p>
          <p>You will see sunflower seed oil on our label. It is the carrier that makes the extract absorbable and stable. It is not filler, and calling the bottle "nothing but hemp" was never quite right of us.</p>
        </div>
        <div class="actions"><button class="cta" data-next>Next</button></div>
      </div>`);
  }

  return frag(`
    <div>
      <p class="kicker">How it is taken</p>
      <h2 class="display" style="font-size:clamp(32px,4.4vw,46px);margin-top:10px">The routine is the whole product</h2>
      <p class="q__hint">Half a dropper, held under the tongue for two minutes, twice a day. Morning and evening, at the same two moments you already have.</p>
      <div class="figure figure--square" style="background-image:url('assets/ritual-drops.jpg');margin:32px 0 0">
        <div class="figure__veil"></div>
        <div class="figure__stat">
          <span class="big">2 min</span>
          <p class="cap">under the tongue, twice a day, for about 30 days per bottle</p>
        </div>
      </div>
      <div class="actions"><button class="cta" data-next>Next</button></div>
    </div>`);
}

/* ---------- Name and email ---------- */
function viewName(){
  const f = frag(`
    <div>
      <h2 class="q__head">What is your first name?</h2>
      <p class="q__hint">So we know what to call you.</p>
      <div class="field"><input id="nameInput" type="text" placeholder="First name" autocomplete="given-name" value="${state.name}"></div>
      <div class="actions"><button class="cta" id="nameNext" ${state.name ? "" : "disabled"}>Next</button></div>
    </div>`);
  setTimeout(() => {
    const input = el("nameInput"), btn = el("nameNext");
    input.addEventListener("input", () => { state.name = input.value.trim(); btn.disabled = !state.name; });
    input.addEventListener("keydown", (e) => { if(e.key === "Enter" && state.name) go(1); });
    btn.addEventListener("click", () => go(1));
    input.focus();
  }, 0);
  return f;
}

function viewEmail(){
  const f = frag(`
    <div>
      <h2 class="q__head">Where should we send your result?</h2>
      <p class="q__hint">Only so you can come back to it. We never sell or share your address.</p>
      <div class="field"><input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" value="${state.email}"></div>
      <p class="consent">By entering your email you agree to receive marketing email from Nesa's Hemp. You can unsubscribe from any message.</p>
      <div class="actions"><button class="cta" id="emailNext" ${state.email ? "" : "disabled"}>See my result</button></div>
    </div>`);
  setTimeout(() => {
    const input = el("emailInput"), btn = el("emailNext");
    const ok = (v) => /.+@.+\..+/.test(v);
    input.addEventListener("input", () => { state.email = input.value.trim(); btn.disabled = !ok(state.email); });
    input.addEventListener("keydown", (e) => { if(e.key === "Enter" && ok(state.email)) go(1); });
    btn.addEventListener("click", () => go(1));
    input.focus();
  }, 0);
  return f;
}

/* ---------- Calculating ---------- */
function viewCalculating(){
  const f = frag(`
    <div>
      <h2 class="display" style="font-size:clamp(28px,3.6vw,40px)">Matching your answers to the label</h2>
      <div class="calc__list">
        <div class="calc__row"><b data-count="14">0</b><span>lab tests run on the batch we would ship you</span></div>
        <div class="calc__row"><b data-count="7">0</b><span>certifications your bottle has to keep</span></div>
        <div class="calc__row"><b data-count="60">0</b><span>servings, which is roughly one month of the routine</span></div>
      </div>
    </div>`);
  setTimeout(() => {
    document.querySelectorAll("[data-count]").forEach((node, idx) => {
      const target = parseInt(node.dataset.count, 10);
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if(reduce){ node.textContent = target; return; }
      let v = 0;
      const stepMs = 900 / target;
      setTimeout(() => {
        const t = setInterval(() => {
          v += 1; node.textContent = v;
          if(v >= target) clearInterval(t);
        }, stepMs);
      }, idx * 300);
    });
    setTimeout(() => go(1), 2600);
  }, 0);
  return f;
}

/* ============================================================
   SCORING
   Five support dimensions, 0 to 100. Higher means the answers
   suggest that area is already steady. Lower means it is where
   the routine should be aimed first.
   This is a self reported profile, not a measurement.
   ============================================================ */
function scores(){
  const a = state.answers;
  const areas = Array.isArray(a.areas) ? a.areas : [];
  const has = (x) => areas.includes(x);
  const clamp = (n) => Math.max(8, Math.min(96, Math.round(n)));

  let comfort = 78;
  if(a.goal === "comfort") comfort -= 24;
  if(has("comfort")) comfort -= 12;
  if(a.day === "physical") comfort -= 14;
  if(a.day === "feet") comfort -= 8;
  if(a.age === "45-60") comfort -= 6;
  if(a.age === "60+") comfort -= 10;

  let sleep = 80;
  if(a.goal === "sleep") sleep -= 24;
  if(has("sleep")) sleep -= 12;
  if(a.sleep === "waking") sleep -= 16;
  if(a.sleep === "falling") sleep -= 22;
  if(a.sleep === "varies") sleep -= 12;
  if(a.caffeine === "two-three") sleep -= 6;
  if(a.caffeine === "four+") sleep -= 14;

  let recovery = 76;
  if(a.goal === "recovery") recovery -= 22;
  if(has("recovery")) recovery -= 12;
  if(a.training === "5+") recovery -= 14;
  if(a.training === "3-4") recovery -= 8;
  if(a.training === "rare") recovery -= 6;
  if(a.day === "physical") recovery -= 10;

  let stress = 78;
  if(a.goal === "stress") stress -= 24;
  if(has("mood")) stress -= 10;
  if(has("focus")) stress -= 8;
  if(a.caffeine === "four+") stress -= 14;
  if(a.caffeine === "two-three") stress -= 6;
  if(a.sleep === "falling") stress -= 10;

  let nutrition = 82;
  if(a.goal === "nutrition") nutrition -= 24;
  if(has("nutrition")) nutrition -= 12;
  if(a.diet === "mixed") nutrition -= 10;
  if(a.diet === "quick") nutrition -= 24;
  if(a.diet === "skipping") nutrition -= 30;

  return [
    {key:"comfort",   name:"Everyday comfort", value:clamp(comfort),
     note:"Drawn from your goal, the areas you picked, and what a normal day asks of your body."},
    {key:"sleep",     name:"Sleep",            value:clamp(sleep),
     note:"Drawn from how you sleep on a normal night and how much caffeine sits in your day."},
    {key:"recovery",  name:"Recovery",         value:clamp(recovery),
     note:"Drawn from how often you train and how physical your working day is."},
    {key:"stress",    name:"Stress load",      value:clamp(stress),
     note:"Drawn from your goal, your caffeine intake, and how easily you fall asleep."},
    {key:"nutrition", name:"Daily nutrition",  value:clamp(nutrition),
     note:"Drawn from what most of your food looks like in a normal week."}
  ];
}

/* ---------- Results scorecard ---------- */
function viewResults(){
  const rows = scores();
  const focus = rows.filter(r => r.value < 60).sort((x,y) => x.value - y.value);
  const lead = focus[0] || rows.slice().sort((x,y) => x.value - y.value)[0];

  const wrap = document.createElement("div");
  wrap.appendChild(frag(`
    <p class="kicker">Your profile</p>
    <h2 class="display" style="font-size:clamp(32px,4.4vw,46px);margin-top:10px">${escapeHtml(state.name || "Here")}, your routine starts here</h2>
    <p class="rec__lede">Your answers point first at <strong>${lead.name.toLowerCase()}</strong>. This is a profile built from what you told us, not a measurement of anything in your body.</p>
  `));

  const card = document.createElement("div");
  card.className = "score";

  rows.forEach(r => {
    const isFocus = r.value < 60;
    const row = document.createElement("button");
    row.className = "score__row";
    row.type = "button";
    row.setAttribute("aria-expanded","false");
    row.innerHTML = `
      <div class="score__head">
        <span class="score__name">${r.name}</span>
        <span class="score__bar"><span class="score__fill" data-w="${r.value}"></span></span>
        <span class="score__tag ${isFocus ? "score__tag--focus" : ""}">${isFocus ? "Focus" : "Steady"}</span>
      </div>
      <p class="score__note" hidden>${r.note}</p>`;
    row.addEventListener("click", () => {
      const note = row.querySelector(".score__note");
      const open = !note.hidden;
      note.hidden = open;
      row.setAttribute("aria-expanded", String(!open));
    });
    card.appendChild(row);
  });
  wrap.appendChild(card);

  wrap.appendChild(frag(`
    <p class="footnote">Scores describe your own answers. They are not a diagnosis and they are not compared against any population average, because we do not hold one.</p>
    <div class="actions"><button class="cta" data-next>See what we recommend</button></div>
  `));

  setTimeout(() => {
    wrap.querySelectorAll(".score__fill").forEach((f, i) => {
      setTimeout(() => { f.style.width = f.dataset.w + "%"; }, 80 + i * 90);
    });
  }, 0);

  return wrap;
}

/* ============================================================
   RECOMMENDATION
   Two live SKUs, so three honest outcomes.
   ============================================================ */
function recommendation(){
  const a = state.answers;
  const areas = Array.isArray(a.areas) ? a.areas : [];
  let oil = 0, powder = 0;

  if(["comfort","sleep","recovery","stress"].includes(a.goal)) oil += 3;
  if(a.goal === "nutrition") powder += 3;

  areas.forEach(v => {
    if(["comfort","sleep","recovery","mood"].includes(v)) oil += 1;
    if(["nutrition","focus"].includes(v)) powder += 1;
  });

  if(a.diet === "quick") powder += 2;
  if(a.diet === "skipping") powder += 3;
  if(a.diet === "mixed") powder += 1;

  if(a.format === "drops") oil += 2;
  if(a.format === "blend") powder += 2;
  if(a.format === "either"){ oil += 1; powder += 1; }

  if(oil >= 4 && powder >= 4){
    return {
      key:"ritual",
      title:"The daily ritual",
      display:"The daily ritual", em:"oil and powder together",
      items:["oil","powder"],
      lede:"Your answers pull in two directions at once, so we would run both. The extract carries the routine, the powder covers what your week is not giving you."
    };
  }
  if(oil >= powder){
    return {
      key:"foundation",
      title:"The foundation",
      display:"The foundation", em:"one bottle, thirty days",
      items:["oil"],
      lede:"One bottle, twice a day, for a month. This is where almost everyone should start, and adding a second product before you know how the first feels is just guessing more expensively."
    };
  }
  return {
    key:"nutrition",
    title:"The nutrition base",
    display:"The nutrition base", em:"one scoop, every morning",
    items:["powder"],
    lede:"Your answers point at what your food is missing more than at anything else. The powder blends into what you already drink, which is the version of this you will actually keep doing."
  };
}

function protocolLines(){
  const a = state.answers;
  const lines = [];

  const first = a.format === "blend"
    ? "One scoop blended into a smoothie, coffee or oats."
    : "Half a dropper under the tongue, held for two minutes before you swallow.";

  if(a.timing === "morning"){
    lines.push(`<b>On waking.</b> ${first} You told us the mornings are where you feel it, so this one goes before anything else, not after breakfast.`);
  } else if(a.timing === "afternoon"){
    lines.push(`<b>Mid morning.</b> ${first} Pushing the first serving later than breakfast puts it closer to the afternoon you are trying to hold together.`);
  } else {
    lines.push(`<b>Morning.</b> ${first} Take it before your first coffee, at the same point in the routine every day.`);
  }

  if(a.timing === "evening" || a.sleep === "falling" || a.sleep === "waking"){
    lines.push("<b>Evening.</b> The second half dropper about two hours before bed, not at bedtime. Earlier suits a night you struggle with more than a larger dose does.");
  } else {
    lines.push("<b>Evening.</b> The second half dropper with dinner, so the two servings sit roughly twelve hours apart.");
  }

  if(a.consistency === "hit-miss" || a.consistency === "forget"){
    lines.push("<b>Because consistency is your honest weak point.</b> Keep the bottle beside the kettle or the toothbrush, not in a cupboard. We will send two reminders in the first fortnight and then stop.");
  } else {
    lines.push("<b>Give it thirty days.</b> One bottle is about a month. Judge it at the end of the bottle, not in the first week.");
  }

  if(a.experience === "nothing"){
    lines.push("<b>You told us hemp did nothing for you before.</b> Check what you took: most retail CBD is a fraction of this strength. If thirty days here still does nothing, ask us for a refund rather than a second bottle.");
  }
  return lines;
}

function viewRecommendation(){
  const rec = recommendation();
  const items = rec.items.map(k => PRODUCTS[k]);
  const total = items.reduce((s,p) => s + p.price, 0);
  const sub = Math.round(items.reduce((s,p) => s + p.sub, 0) * 100) / 100;
  const wrap = document.createElement("div");

  wrap.appendChild(frag(`
    <p class="kicker">${rec.em}</p>
    <h2 class="display rec__head">${rec.display}</h2>
    <p class="rec__lede">${rec.lede}</p>
  `));

  const buy = document.createElement("div");
  buy.className = "buy";
  const list = document.createElement("div");
  list.className = "buy__items";
  items.forEach(p => {
    list.appendChild(frag(`
      <div class="buy__item">
        <img src="${p.img}" alt="${p.name}">
        <div class="buy__copy">
          <h4>${p.name.replace("CBDa", '<span class="nocaps">CBDa</span>')}</h4>
          <p>${p.meta}</p>
        </div>
        <div class="buy__price">$${p.price.toFixed(2)}</div>
      </div>`));
  });
  buy.appendChild(list);

  const plans = document.createElement("div");
  plans.className = "plans";
  [
    {v:"subscribe", label:"Deliver every 30 days", note:"Change or cancel from your account at any time", cost:sub, save:true},
    {v:"once", label:"One time order", note:"No subscription, no reminders", cost:total, save:false}
  ].forEach(pl => {
    const b = document.createElement("button");
    b.className = "plan" + (pl.save ? " plan--saver" : "");
    b.type = "button";
    b.setAttribute("aria-pressed", state.plan === pl.v ? "true" : "false");
    b.innerHTML = `
      ${pl.save ? `<span class="plan__save">Save $${(total - sub).toFixed(2)}</span>` : ""}
      <span class="plan__radio"></span>
      <span class="plan__copy"><b>${pl.label}</b><span>${pl.note}</span></span>
      <span class="plan__cost">$${pl.cost.toFixed(2)}</span>`;
    b.addEventListener("click", () => { state.plan = pl.v; render(); });
    plans.appendChild(b);
  });
  buy.appendChild(plans);
  wrap.appendChild(buy);

  wrap.appendChild(frag(`<div class="actions"><button class="cta">Add to cart</button></div>`));

  wrap.appendChild(frag(`
    <div class="protocol">
      <p class="label">Your protocol</p>
      <ol>${protocolLines().map(l => `<li>${l}</li>`).join("")}</ol>
    </div>`));

  wrap.appendChild(frag(`
    <div class="trust">
      <div class="certs__row">
        <img src="assets/certs/usda-organic.png" alt="USDA Organic">
        <img src="assets/certs/mosa.png" alt="MOSA Certified Organic">
        <img src="assets/certs/kosher.png" alt="Kosher, Kosher Supervisors of Wisconsin">
        <img src="assets/certs/gmo-free.png" alt="GMO Free">
        <img src="assets/certs/vegan.png" alt="Vegan">
        <img src="assets/certs/raw-food.png" alt="Raw Food">
        <img src="assets/certs/tested-safe.png" alt="Tested Safe Certified Hemp Extract">
      </div>
      <p class="footnote">Every batch ships with a QR code that opens its own 14 test panel, covering potency, pesticides, heavy metals, mycotoxins, residual solvents and microbiology.</p>
    </div>`));

  wrap.appendChild(frag(`
    <div class="actions"><button class="cta cta--quiet" data-restart>Start the quiz again</button></div>
    <p class="disclaimer">These statements have not been evaluated by the Food and Drug Administration. This product is not intended to diagnose, treat, cure or prevent any disease. Hemp extract contains less than the 0.3% federal THC limit. If you take prescription medication or you are pregnant or nursing, speak with your doctor first.</p>`));

  return wrap;
}

/* ============================================================
   HELPERS AND WIRING
   ============================================================ */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.addEventListener("click", (e) => {
  if(e.target.closest("[data-next]")) go(1);
  if(e.target.closest("[data-restart]")){
    state.i = 0; state.answers = {}; state.name = ""; state.email = ""; state.plan = "subscribe";
    render();
  }
});

el("backBtn").addEventListener("click", () => go(-1));

/* Prototype review toolbar */
function buildTools(){
  const p = el("toolsPanel");
  const open = p.dataset.open === "true";
  const list = visibleScreens();
  p.innerHTML = list.map((s,i) =>
    `<button data-jump="${i}" data-current="${i === state.i}">${String(i+1).padStart(2,"0")} &nbsp; ${s.title}</button>`
  ).join("");
  p.dataset.open = open ? "true" : "false";
  p.querySelectorAll("[data-jump]").forEach(b => {
    b.addEventListener("click", () => jumpTo(parseInt(b.dataset.jump, 10)));
  });
}
el("toolsToggle").addEventListener("click", () => {
  const p = el("toolsPanel");
  p.dataset.open = p.dataset.open === "true" ? "false" : "true";
});

render();
</script>

<!doctype html>
<!--
  README: how this page gets its data

  Everything you see comes from data.json in this same folder. The page fetches data.json?t=<time> on load
  (so no cache serves an old copy), checks again every 10 minutes while the tab is open, and works out the
  pipeline counts itself from the candidates list. To update the page, edit data.json only; never edit
  this file for a status change.

  One change is one edit in data.json:
  1. Set "updated" to now, as ISO time with the IST offset (2026-11-27T13:07:00+05:30). Do this on every
     hourly run, even when nothing else changed: the header turns amber when it is over 2 hours old.
  2. A candidate moves on: change "stage" (shortlisted, contacted, replied, proof, call), "status" (the
     short line under the name), "proof" (typed yes or no; numbers yes, partial or no; screenshots no,
     asked, refused or yes), "shared", "missing", "next" and "lastActivity" ({ "at": ISO time, "text" }).
  3. Someone leaves this round: keep "stage" at the furthest step reached and set "outcome" to dropped
     or declined. Earlier rounds and old contacts get "closed": true and drop out of every count.
  4. An open decision for Bhaskar: add { "id", "candidate", "title", "detail", "since" } to "decisions".
     Remove it once he has decided. An empty list shows "decisionsEmpty".
  5. Links must start with https. No pay figures, employer names, emails or phone numbers: this page is public.

  The block with id "fallback" near the end of this file is a copy of data.json from the last layout build.
  It only shows when data.json cannot be loaded, with a note saying so. Leave it alone.
-->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Media buyer search</title>
<style>
  :root {
    --bg: #f5f5f6;
    --surface: #ffffff;
    --band: #f8f8f9;
    --line: #e4e4e7;
    --ink: #18181b;
    --ink-2: #3f3f46;
    --muted: #5f5f6b;
    --accent: #1d6b50;
    --accent-tint: #e6f2ec;
    --amber: #8a5a00;
    --amber-tint: #fbefd6;
    --red: #b42318;
    --red-tint: #fbe3e0;
    --empty: #e4e4e7;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--ink); text-underline-offset: 2px; }
  a:hover { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  svg { flex: none; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: grid; gap: 32px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { margin: 0; text-wrap: pretty; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
  .top h1 { font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
  .top .round { margin-top: 4px; color: var(--muted); font-size: 16px; }
  .fresh { display: grid; gap: 2px; justify-items: end; text-align: right; }
  .fresh-line { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .fresh-line b { font-weight: 600; color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .fresh.stale .dot { background: #c27c0e; }
  .fresh-sub { font-size: 12px; color: var(--muted); }
  .fresh.stale .fresh-sub { color: var(--amber); }

  .note { padding: 12px 16px; border-radius: var(--radius); background: var(--amber-tint); color: #5c3d00; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
  .note svg { width: 18px; height: 18px; margin-top: 1px; }

  /* Pipeline */
  .pipe { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .pipe li { background: var(--surface); padding: 16px 20px; display: grid; gap: 2px; align-content: start; }
  .pipe .lab { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .pipe .lab svg { width: 14px; height: 14px; }
  .pipe .val { font-size: 32px; line-height: 1.15; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--ink); }
  .pipe .val small { font-size: 16px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .pipe .sub { font-size: 12px; color: var(--muted); }
  .pipe li.zero .val { color: var(--muted); }
  .rule { margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 14px; max-width: 75ch; }
  .rule svg { width: 16px; height: 16px; margin-top: 3px; }

  /* Section headings */
  .sec-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .sec-head h2 { font-size: 18px; font-weight: 600; }
  .sec-head .n { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }

  /* Waiting on you */
  .waiting { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .waiting ul { list-style: none; margin: 0; padding: 0; }
  .waiting li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 20px; }
  .waiting li + li { border-top: 1px solid var(--line); }
  .waiting .t { font-weight: 600; }
  .waiting .d { color: var(--ink-2); font-size: 14px; }
  .waiting.has { background: var(--accent-tint); border-color: #b9d9c9; }
  .waiting.has li + li { border-top-color: #cfe5d9; }
  .calm { display: flex; gap: 12px; align-items: center; padding: 16px 20px; color: var(--ink-2); }
  .calm svg { width: 20px; height: 20px; color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 14px;
    background: var(--surface); border: 1px solid #c9c9cf; border-radius: 8px; font: inherit; font-size: 14px;
    color: var(--ink); text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #f1f1f3; color: var(--ink); }
  .btn svg { width: 14px; height: 14px; }

  /* Candidate list */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .group + .group { border-top: 1px solid var(--line); }
  .g-head { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--band); font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .g-head .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .g-head svg { width: 16px; height: 16px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid; gap: 12px 24px; padding: 18px 20px;
    grid-template-columns: 250px minmax(0, 1fr) 232px 112px;
    grid-template-areas: "person notes proof time";
    scroll-margin-top: 24px;
    border-top: 1px solid var(--line);
  }
  .row:target { background: var(--accent-tint); }
  .person { grid-area: person; display: grid; gap: 4px; align-content: start; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; }
  .where { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .pill { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: #f0f0f2; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
  .pill svg { width: 12px; height: 12px; }
  .status { font-size: 14px; color: var(--ink-2); }
  .links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; }
  .links a { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
  .links svg { width: 12px; height: 12px; color: var(--muted); }

  .notes { grid-area: notes; margin: 0; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 6px 12px; align-content: start; min-width: 0; }
  .notes dt { font-size: 14px; color: var(--muted); padding-top: 1px; }
  .notes dd { margin: 0; font-size: 16px; color: var(--ink); overflow-wrap: anywhere; }
  .notes dd.none { color: var(--muted); }
  .notes dd.msg { grid-column: 1 / -1; }
  details.msg > summary { cursor: pointer; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; min-height: 40px; list-style: none; }
  details.msg > summary::-webkit-details-marker { display: none; }
  details.msg > summary svg { width: 14px; height: 14px; transition: transform .15s ease-out; }
  details.msg[open] > summary svg { transform: rotate(90deg); }
  .msg-box { margin-top: 4px; display: grid; gap: 8px; justify-items: start; }
  .msg-text { margin: 0; padding: 12px 14px; background: var(--band); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* Proof meter: the signature element */
  .proof { grid-area: proof; align-self: start; }
  .meter { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 6px; }
  .seg { height: 8px; border-radius: 999px; background: var(--empty); }
  .seg.yes { background: var(--accent); }
  .seg.partial { background: linear-gradient(90deg, var(--accent) 50%, var(--empty) 50%); }
  .seg.asked { background: var(--amber-tint); border: 1px dashed #c27c0e; }
  .seg.refused { background: var(--red-tint); border: 1px solid var(--red); }
  .cap { font-size: 12px; line-height: 1.35; color: var(--muted); }
  .cap b { display: block; font-weight: 600; font-size: 14px; }
  .cap b.yes { color: var(--accent); }
  .cap b.partial, .cap b.asked { color: var(--amber); }
  .cap b.refused { color: var(--red); }
  .cap b.no, .cap b.unknown { color: var(--muted); font-weight: 400; }

  .time { grid-area: time; text-align: right; display: grid; gap: 2px; align-content: start; justify-items: end; font-variant-numeric: tabular-nums; }
  .time .rel { font-size: 14px; color: var(--ink-2); }
  .time .abs { font-size: 12px; color: var(--muted); }

  .group.out .seg.yes { background: #8a8a94; }
  .group.out .cap b.yes { color: var(--ink-2); }

  /* Earlier and closed */
  details.closed { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

  details.closed > summary svg { width: 16px; height: 16px; color: var(--muted); transition: transform .15s ease-out; }
  details.closed[open] > summary svg { transform: rotate(90deg); }
  details.closed > summary .t { font-weight: 600; }
  details.closed > summary .n { color: var(--muted); }
  details.closed > summary .h { color: var(--muted); font-size: 14px; margin-left: auto; text-align: right; }
  .old { list-style: none; margin: 0; padding: 0; }
  .old li { display: grid; grid-template-columns: 240px minmax(0, 1fr) auto; gap: 4px 24px; padding: 12px 20px; border-top: 1px solid var(--line); align-items: baseline; }
  .old .who b { font-weight: 600; }
  .old .who span { display: block; font-size: 14px; color: var(--muted); }
  .old .what { font-size: 14px; color: var(--ink-2); }
  .old .right { display: flex; gap: 12px; align-items: baseline; font-size: 14px; color: var(--muted); white-space: nowrap; }

  .foot { font-size: 12px; color: var(--muted); }

  @media (max-width: 1080px) {
    .row { grid-template-columns: minmax(0, 1fr) 232px; grid-template-areas: "person time" "notes proof"; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 20px 16px 48px; gap: 24px; }
    .top h1 { font-size: 24px; }
    .fresh { justify-items: start; text-align: left; }
    .pipe li { padding: 12px 8px; }
    .pipe .lab { font-size: 12px; line-height: 1.3; min-height: 32px; align-items: flex-start; }
    .pipe .lab svg { display: none; }
    .pipe .val { font-size: 24px; }
    .pipe .val small { font-size: 12px; margin-left: 2px; }
    .pipe .sub { display: none; }
    .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "person time" "proof proof" "notes notes"; padding: 16px; gap: 12px 16px; }
    .notes { grid-template-columns: 64px minmax(0, 1fr); }
    .g-head { padding: 10px 16px; }
    .waiting li { grid-template-columns: minmax(0, 1fr); padding: 14px 16px; }
    .waiting .btn { justify-self: start; }
    .calm { padding: 16px; }
    details.closed > summary { padding: 14px 16px; flex-wrap: wrap; }
    details.closed > summary .h { margin-left: 0; text-align: left; flex-basis: 100%; }
    .old li { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
    .old .right { white-space: normal; flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    details.msg > summary svg, details.closed > summary svg { transition: none; }
  }
</style>

      <ul class="old" id="old"></ul>
    </details>
  </section>

  <p class="foot">Data comes from data.json next to this page. This page checks for new data every 10 minutes while it is open.</p>
</main>

<script>
(function () {
  'use strict';
  var STAGES = [
    { id: 'shortlisted', label: 'Shortlisted' },
    { id: 'contacted', label: 'Contacted' },
    { id: 'replied', label: 'Replied' },
    { id: 'proof', label: 'Proof received' },
    { id: 'call', label: 'Call booked' }
  ];
  var STAGE_INDEX = {};
  STAGES.forEach(function (s, i) { STAGE_INDEX[s.id] = i; });
  var PROOF_KEYS = [
    { key: 'typed', label: 'Typed', ok: ['yes', 'no'] },
    { key: 'numbers', label: 'Numbers', ok: ['yes', 'partial', 'no'] },
    { key: 'screenshots', label: 'Screenshots', ok: ['yes', 'asked', 'refused', 'no'] }
  ];
  var STATE_WORD = { yes: 'Yes', partial: 'Partial', asked: 'Asked', refused: 'Refused', no: 'None', unknown: 'Unknown' };
  var GROUPS = [
    { id: 'ready', title: 'Proof in, ready for a call', icon: 'full' },
    { id: 'proof', title: 'Replied, waiting on their proof', icon: 'half' },
    { id: 'reply', title: 'Contacted, waiting on a reply', icon: 'quarter' },
    { id: 'notyet', title: 'Not contacted yet', icon: 'ring' },
    { id: 'out', title: 'Out of this round', icon: 'cross' },
    { id: 'check', title: 'Check data.json: unknown stage', icon: 'ring' }
  ];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var STALE_MIN = 120;
  var current = null;
  var scrolledToHash = false;

  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svg(parts, box) {
    var s = document.createElementNS(SVG_NS, 'svg');
    s.setAttribute('viewBox', box || '0 0 16 16');
    s.setAttribute('aria-hidden', 'true');
    s.setAttribute('fill', 'none');
    parts.forEach(function (p) {
      var n = document.createElementNS(SVG_NS, p[0]);
      Object.keys(p[1]).forEach(function (k) { n.setAttribute(k, p[1][k]); });
      s.appendChild(n);
    });
    return s;
  }
  var C_GREEN = '#1d6b50', C_AMBER = '#c27c0e', C_GREY = '#8a8a94', C_INK = '#3f3f46';
  function stageIcon(kind) {
    function ring(c) { return ['circle', { cx: 8, cy: 8, r: 6, stroke: c, 'stroke-width': 1.6 }]; }
    if (kind === 'full') return svg([ring(C_GREEN), ['circle', { cx: 8, cy: 8, r: 3.2, fill: C_GREEN }]]);
    if (kind === 'half') return svg([ring(C_AMBER), ['path', { d: 'M8 4.8a3.2 3.2 0 0 1 0 6.4z', fill: C_AMBER }]]);
    if (kind === 'quarter') return svg([ring(C_INK), ['path', { d: 'M8 4.8a3.2 3.2 0 0 1 3.2 3.2H8z', fill: C_INK }]]);
    if (kind === 'cross') return svg([ring(C_GREY), ['path', { d: 'M6 6l4 4M10 6l-4 4', stroke: C_GREY, 'stroke-width': 1.6, 'stroke-linecap': 'round' }]]);
    return svg([ring(C_GREY)]);
  }
  var STAGE_ICON = { shortlisted: 'ring', contacted: 'quarter', replied: 'half', proof: 'full', call: 'full' };
  function chevron() {
    return svg([['path', { d: 'm6 4 4 4-4 4', stroke: 'currentColor', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }]]);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function str(v) { return typeof v === 'string' ? v.trim() : ''; }
  function safeHref(h) { return typeof h === 'string' && /^https:\/\/\S+$/i.test(h) ? h : null; }
  function parseTime(v) {
    if (typeof v !== 'string') return null;
    var t = Date.parse(v);
    return isNaN(t) ? null : new Date(t);
  }

  // Times always show in IST, whatever the viewer's own clock says.
  function fmtIST(d) {
    var ist = new Date(d.getTime() + 330 * 60000);
    var h = ist.getUTCHours(), m = ist.getUTCMinutes();
    var ap = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return ist.getUTCDate() + ' ' + MONTHS[ist.getUTCMonth()] + ', ' + h12 + ':' + String(m).padStart(2, '0') + ' ' + ap;
  }
  function ago(d) {
    var min = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
    if (min < 1) return 'just now';
    if (min < 60) return min + ' min ago';
    var h = Math.floor(min / 60);
    if (h < 24) return h + ' h ago';
    var days = Math.floor(h / 24);
    return days === 1 ? '1 day ago' : days + ' days ago';
  }
  function relSpan(d) {
    var s = el('span', 'rel', ago(d));
    s.setAttribute('data-at', String(d.getTime()));
    return s;
  }

  function valid(d) {
    return !!(d && typeof d === 'object' && parseTime(d.updated) && Array.isArray(d.candidates));
  }

  function proofState(c, key, ok) {
    var v = c.proof && typeof c.proof === 'object' ? c.proof[key] : undefined;
    if (v === true) v = 'yes';
    if (v === false || v === undefined || v === null || v === '') v = 'no';
    return ok.indexOf(v) === -1 ? 'unknown' : v;
  }
  function hasScreens(c) { return proofState(c, 'screenshots', PROOF_KEYS[2].ok) === 'yes'; }

  function groupOf(c) {
    if (c.outcome === 'dropped' || c.outcome === 'declined') return 'out';
    if (!(c.stage in STAGE_INDEX)) return 'check';
    if (c.stage === 'shortlisted') return 'notyet';
    if (c.stage === 'contacted') return 'reply';
    if (hasScreens(c) || c.stage === 'proof') return 'ready';
    return 'proof';
  }

  // Counts are people who reached each step this round; proof counts screenshots only.
  function counts(active) {
    var out = { shortlisted: active.length, contacted: 0, replied: 0, proof: 0, call: 0 };
    active.forEach(function (c) {
      var i = STAGE_INDEX[c.stage];
      if (i === undefined) return;
      if (i >= 1) out.contacted++;
      if (i >= 2) out.replied++;
      if (hasScreens(c)) out.proof++;
      if (c.stage === 'call') out.call++;
    });
    return out;
  }

  function renderHeader(d) {
    var r = d.round || {};
    document.getElementById('round-title').textContent = str(r.title) ? 'This round: ' + str(r.title) : '';
    var up = parseTime(d.updated);
    document.getElementById('updated-abs').textContent = fmtIST(up) + ' IST';
    document.getElementById('updated-rel').textContent = '(' + ago(up) + ')';
    var stale = (Date.now() - up.getTime()) / 60000 > STALE_MIN;
    document.getElementById('fresh').classList.toggle('stale', stale);
    document.getElementById('fresh-sub').textContent = stale
      ? 'Over 2 hours old. The hourly update may have stopped.'
      : 'Rewritten by the autopilot every hour.';
  }

  function renderPipe(d, active) {
    var n = counts(active);
    var r = d.round || {};
    var target = typeof r.callTarget === 'number' ? r.callTarget : null;
    var subs = {
      shortlisted: str(r.shortlistNote) || 'this round',
      contacted: 'of ' + n.shortlisted + ' shortlisted',
      replied: 'of ' + n.contacted + ' contacted',
      proof: 'ad account screenshots',
      call: target ? 'target ' + target + ' calls' : 'this round'
    };
    var ol = document.getElementById('pipe');
    ol.textContent = '';
    STAGES.forEach(function (s) {
      var li = el('li', n[s.id] === 0 ? 'zero' : '');
      var lab = el('span', 'lab');
      lab.appendChild(stageIcon(STAGE_ICON[s.id]));
      lab.appendChild(document.createTextNode(s.label));
      var val = el('span', 'val', n[s.id]);
      if (s.id === 'call' && target) val.appendChild(el('small', null, 'of ' + target));
      li.appendChild(lab);
      li.appendChild(val);
      li.appendChild(el('span', 'sub', subs[s.id]));
      ol.appendChild(li);
    });
    document.getElementById('rule').textContent = str(r.rule);
  }

  function renderWaiting(d, byId) {
    var box = document.getElementById('waiting');
    box.textContent = '';
    var list = Array.isArray(d.decisions) ? d.decisions.filter(function (x) { return x && str(x.title); }) : [];
    document.getElementById('wait-n').textContent = String(list.length);
    box.classList.toggle('has', list.length > 0);
    if (!list.length) {
      var calm = el('p', 'calm');
      calm.appendChild(svg([['circle', { cx: 12, cy: 12, r: 9, stroke: 'currentColor', 'stroke-width': 2 }], ['path', { d: 'm8 12.5 2.6 2.5L16 9.5', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }]], '0 0 24 24'));
      calm.appendChild(el('span', null, str(d.decisionsEmpty) || 'Nothing waiting on you.'));
      box.appendChild(calm);
      return;
    }
    var ul = el('ul');
    list.forEach(function (x) {
      var li = el('li');
      var text = el('div');
      text.appendChild(el('div', 't', str(x.title)));
      var since = parseTime(x.since);
      var detail = [str(x.detail), since ? 'Since ' + fmtIST(since) + ' IST.' : ''].filter(Boolean).join(' ');
      if (detail) text.appendChild(el('div', 'd', detail));
      li.appendChild(text);
      var who = byId[x.candidate];
      if (who) {
        var a = el('a', 'btn', 'Open ' + who.name.split(' ')[0]);
        a.href = '#c-' + who.id;
        a.appendChild(chevron());
        li.appendChild(a);
      }
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }

  function linkRow(links) {
    var box = el('div', 'links');
    (Array.isArray(links) ? links : []).forEach(function (l) {
      var href = l && safeHref(l.href);
      if (!href) return;
      var a = el('a', null, str(l.label) || 'Profile');
      a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.appendChild(svg([['path', { d: 'M6 3h7v7M13 3 6.5 9.5M11 9.5V13H3V5h3.5', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }]]));
      box.appendChild(a);
    });
    return box.childNodes.length ? box : null;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return Promise.reject(new Error('no clipboard'));
  }

  function meter(c) {
    var wrap = el('div', 'proof');
    var m = el('div', 'meter');
    var words = [];
    PROOF_KEYS.forEach(function (p) { m.appendChild(el('span', 'seg ' + proofState(c, p.key, p.ok))); });
    PROOF_KEYS.forEach(function (p) {
      var st = proofState(c, p.key, p.ok);
      var cap = el('span', 'cap');
      cap.appendChild(el('b', st, STATE_WORD[st]));
      cap.appendChild(document.createTextNode(p.label));
      m.appendChild(cap);
      words.push(p.label.toLowerCase() + ' ' + STATE_WORD[st].toLowerCase());
    });
    m.setAttribute('role', 'img');
    m.setAttribute('aria-label', 'Proof: ' + words.join(', '));
    wrap.appendChild(m);
    return wrap;
  }

  function row(c) {
    var li = el('li', 'row');
    li.id = 'c-' + c.id;

    var person = el('div', 'person');
    person.appendChild(el('span', 'name', c.name));
    var where = [str(c.location), str(c.about)].filter(Boolean).join(' · ');
    if (where) person.appendChild(el('span', 'where', where));
    var pill = el('span', 'pill');
    var known = STAGES[STAGE_INDEX[c.stage]];
    var stageLabel = c.outcome === 'dropped' ? 'Dropped' : c.outcome === 'declined' ? 'Declined' : (known ? known.label : 'Unknown stage');
    pill.appendChild(stageIcon(c.outcome ? 'cross' : (STAGE_ICON[c.stage] || 'ring')));
    pill.appendChild(document.createTextNode(stageLabel));
    person.appendChild(pill);
    if (str(c.status)) person.appendChild(el('span', 'status', str(c.status)));
    var links = linkRow(c.links);
    if (links) person.appendChild(links);
    li.appendChild(person);

    var dl = el('dl', 'notes');
    function item(label, value, emptyText) {
      if (!value && !emptyText) return;
      dl.appendChild(el('dt', null, label));
      dl.appendChild(el('dd', value ? null : 'none', value || emptyText));
    }
    var act = c.lastActivity && typeof c.lastActivity === 'object' ? c.lastActivity : null;
    item('Shared', str(c.shared), (STAGE_INDEX[c.stage] || 0) >= 2 ? 'Nothing yet' : '');
    item('Missing', str(c.missing));
    item('Next', str(c.next));
    item('Latest', act ? str(act.text) : '', act ? '' : 'No activity yet');
    if (c.message && str(c.message.text)) {
      var det = el('details', 'msg');
      var sum = el('summary');
      sum.appendChild(chevron());
      sum.appendChild(document.createTextNode(str(c.message.label) || 'Message to send'));
      det.appendChild(sum);
      var mbox = el('div', 'msg-box');
      var pre = el('p', 'msg-text', str(c.message.text));
      var btn = el('button', 'btn', 'Copy message');
      btn.type = 'button';
      btn.addEventListener('click', function () {
        copyText(pre.textContent).then(function () { btn.textContent = 'Copied'; }, function () { btn.textContent = 'Select the text and copy it'; });
        setTimeout(function () { btn.textContent = 'Copy message'; }, 2500);
      });
      mbox.appendChild(pre);
      mbox.appendChild(btn);
      det.appendChild(mbox);
      var dd = el('dd', 'msg');
      dd.appendChild(det);
      dl.appendChild(dd);
    }
    li.appendChild(dl);

    li.appendChild(meter(c));

    var time = el('div', 'time');
    var at = act ? parseTime(act.at) : null;
    if (at) {
      time.appendChild(relSpan(at));
      time.appendChild(el('span', 'abs', fmtIST(at)));
    } else {
      time.appendChild(el('span', 'abs', 'No activity'));
    }
    li.appendChild(time);
    return li;
  }

  function lastTime(c) {
    var t = c.lastActivity && parseTime(c.lastActivity.at);
    return t ? t.getTime() : 0;
  }

  function renderList(active) {
    var box = document.getElementById('list');
    box.textContent = '';
    document.getElementById('list-n').textContent = String(active.length);
    GROUPS.forEach(function (g) {
      var members = active.filter(function (c) { return groupOf(c) === g.id; })
        .sort(function (a, b) {
          var s = (STAGE_INDEX[b.stage] || 0) - (STAGE_INDEX[a.stage] || 0);
          return s || lastTime(b) - lastTime(a);
        });
      if (!members.length) return;
      var sec = el('section', 'group ' + g.id);
      var head = el('h3', 'g-head');
      head.appendChild(stageIcon(g.icon));
      head.appendChild(document.createTextNode(g.title));
      head.appendChild(el('span', 'n', members.length));
      sec.appendChild(head);
      var ul = el('ul', 'rows');
      members.forEach(function (c) { ul.appendChild(row(c)); });
      sec.appendChild(ul);
      box.appendChild(sec);
    });
  }

  function renderClosed(closed) {
    var ul = document.getElementById('old');
    ul.textContent = '';
    document.getElementById('closed-n').textContent = String(closed.length);
    closed.slice().sort(function (a, b) { return lastTime(b) - lastTime(a); }).forEach(function (c) {
      var li = el('li');
      var who = el('div', 'who');
      who.appendChild(el('b', null, c.name));
      var sub = [str(c.about), str(c.location)].filter(Boolean).join(' · ');
      if (sub) who.appendChild(el('span', null, sub));
      li.appendChild(who);
      li.appendChild(el('div', 'what', str(c.status)));
      var right = el('div', 'right');
      var at = c.lastActivity && parseTime(c.lastActivity.at);
      if (at) right.appendChild(el('span', null, fmtIST(at).split(',')[0]));
      var links = linkRow(c.links);
      if (links) right.appendChild(links);
      li.appendChild(right);
      ul.appendChild(li);
    });
  }

  function render(d) {
    var open = {};
    document.querySelectorAll('details.msg[open]').forEach(function (n) { var r = n.closest('.row'); if (r) open[r.id] = true; });
    current = d;
    var named = d.candidates.filter(function (c) { return c && typeof c === 'object' && str(c.id) && str(c.name); });
    var active = named.filter(function (c) { return c.closed !== true; });
    var closed = named.filter(function (c) { return c.closed === true; });
    var byId = {};
    named.forEach(function (c) { byId[c.id] = c; });
    renderHeader(d);
    renderPipe(d, active);
    renderWaiting(d, byId);
    renderList(active);
    renderClosed(closed);
    Object.keys(open).forEach(function (id) { var r = document.getElementById(id); var m = r && r.querySelector('details.msg'); if (m) m.open = true; });
    if (!scrolledToHash && location.hash) {
      scrolledToHash = true;
      var target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    }
  }

  function tick() {
    if (!current) return;
    renderHeader(current);
    document.querySelectorAll('[data-at]').forEach(function (n) { n.textContent = ago(new Date(Number(n.getAttribute('data-at')))); });
  }

  function savedCopy() {
    try {
      var f = JSON.parse(document.getElementById('fallback').textContent);
      return valid(f) ? f : null;
    } catch (e) { return null; }
  }

  function showFallback(reason) {
    // A later refresh that fails keeps the live data already on screen.
    if (document.documentElement.getAttribute('data-source') === 'live') return;
    var f = savedCopy();
    var text = document.getElementById('fallback-text');
    document.documentElement.setAttribute('data-source', 'fallback');
    if (f) {
      render(f);
      text.textContent = 'Could not load the latest data (' + reason + '). Showing the copy saved in this page, last updated ' + fmtIST(parseTime(f.updated)) + ' IST.';
    } else {
      text.textContent = 'Could not load the latest data (' + reason + '), and this page has no saved copy.';
    }
    document.getElementById('fallback-note').hidden = false;
  }

  var lastFetch = 0;
  function load() {
    lastFetch = Date.now();
    if (!window.fetch) { showFallback('this browser cannot fetch it'); return; }
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('data.json returned ' + r.status);
        return r.json().catch(function () { throw new Error('data.json is not valid JSON'); });
      })
      .then(function (d) {
        if (!valid(d)) throw new Error('data.json has no valid updated time or candidates list');
        document.documentElement.setAttribute('data-source', 'live');
        document.getElementById('fallback-note').hidden = true;
        render(d);
      })
      .catch(function (e) { showFallback(e && e.message ? e.message : 'network error'); });
  }

  load();
  setInterval(load, 10 * 60 * 1000);
  setInterval(tick, 60 * 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - lastFetch > 5 * 60 * 1000) load();
  });
})();
</script>
</body>
</html>

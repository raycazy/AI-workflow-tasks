<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATITUDE</title>
<meta name="description" content="A private gathering.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23000' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --ink-64: rgba(0, 0, 0, 0.64);
    --ink-40: rgba(0, 0, 0, 0.45);
    --hairline: rgba(0, 0, 0, 0.16);
    --font: 'Switzer', 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 300;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 1.1fr auto 1fr;
  }
  section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    position: relative;
  }
  /* The latitude lines: the page's only structure */
  .parallel {
    height: 1px;
    width: 100%;
    background: var(--hairline);
    transform-origin: center;
  }

  /* Wordmark */
  .wordmark {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 300;
    letter-spacing: 0.52em;
    text-indent: 0.52em; /* optically recenters tracked caps */
    text-transform: uppercase;
  }
  .wordmark .degree { letter-spacing: 0; }

  /* Access */
  .access-label, .partner-heading {
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-64);
    letter-spacing: 0.02em;
  }
  form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: min(360px, 84vw);
    margin-top: 28px;
  }
  input {
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--ink-40);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 300;
    font-size: 18px;
    text-align: center;
    padding: 10px 4px;
    letter-spacing: 0.06em;
    border-radius: 0;
    transition: border-color 200ms ease-out;
  }
  input::placeholder { color: var(--ink-64); font-size: 14px; letter-spacing: 0.04em; }
  input:focus { outline: none; border-bottom-color: var(--ink); }
  input:focus-visible { outline: 1px solid var(--ink-64); outline-offset: 6px; }
  button {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    text-transform: uppercase;
    padding: 15px 40px;
    min-height: 48px;
    cursor: pointer;
    transition: background-color 200ms ease-out, color 200ms ease-out;
  }
  button:hover { background: var(--ink); color: var(--bg); }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  /* Partner */
  .partner-note {
    font-size: 12px;
    color: var(--ink-64);
    max-width: 44ch;
    line-height: 1.7;
    margin-top: 12px;
  }
  .confirmation {
    font-size: 14px;
    color: var(--ink-64);
    margin-top: 28px;
    line-height: 1.7;
  }

  /* Instagram: the only public link */
  .instagram {
    position: fixed;
    right: 24px;
    bottom: 20px;
    color: var(--ink-40);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    transition: color 200ms ease-out;
  }
  .instagram:hover { color: var(--ink); }
  .instagram svg { width: 17px; height: 17px; }

  /* Entry sequence: latitude lines draw first, then the three stanzas surface */
  @media (prefers-reduced-motion: no-preference) {
    .parallel { animation: draw 900ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .reveal { animation: surface 700ms ease-out both; }
    .reveal:nth-of-type(1) { animation-delay: 350ms; }
    .reveal:nth-of-type(2) { animation-delay: 500ms; }
    .reveal:nth-of-type(3) { animation-delay: 650ms; }
    @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes surface { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .shake { animation: shake 350ms ease-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      55% { transform: translateX(5px); }
      80% { transform: translateX(-3px); }
    }
    body.leaving { opacity: 0; transition: opacity 400ms ease-out; }
  }

  @media (max-height: 620px) {
    section { padding: 24px; }
    form { margin-top: 20px; gap: 20px; }
  }
</style>
</head>
<body>
<main>
  <section class="reveal" aria-label="Latitude">
    <h1 class="wordmark">Latitude<span class="degree">&deg;</span></h1>
  </section>

  <div class="parallel" role="presentation"></div>

  <section class="reveal" aria-label="Latitude access">
    <p class="access-label" id="access-label">Enter your Latitude Access Key</p>
    <form id="access-form" novalidate>
      <input type="password" id="access-key" autocomplete="off" aria-labelledby="access-label">
      <button type="submit">Enter</button>
    </form>
  </section>

  <div class="parallel" role="presentation"></div>

  <section class="reveal" aria-label="Become a Latitude Partner">
    <h2 class="partner-heading">Interested in becoming a Latitude Partner for 2027?</h2>
    <p class="partner-note">This registration is exclusively for brand partners. Designer participation is strictly by invitation only.</p>
    <form id="partner-form" novalidate>
      <input type="email" id="partner-email" placeholder="Email address" autocomplete="email" aria-label="Email address">
      <button type="submit">Register Interest</button>
    </form>
  </section>
</main>

<a class="instagram" href="https://www.instagram.com/latitude.beyond" target="_blank" rel="noopener" aria-label="Latitude on Instagram">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
  </svg>
</a>

<script>
  // Mockup behavior. Production: POST /api/enter, server-side key check, HttpOnly cookie.
  const accessForm = document.getElementById('access-form');
  const accessKey = document.getElementById('access-key');
  accessForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (accessKey.value.trim().length > 0) {
      document.body.classList.add('leaving');
      setTimeout(() => { window.location.href = 'private.html'; }, 420);
    } else {
      accessKey.classList.remove('shake');
      void accessKey.offsetWidth;
      accessKey.classList.add('shake');
      accessKey.focus();
    }
  });

  // Partner registrations post to the Google Sheet via an Apps Script webhook.
  // Paste the deployed /exec URL here; while empty the form only shows the confirmation.
  const REGISTER_ENDPOINT = '';
  const partnerForm = document.getElementById('partner-form');
  const partnerEmail = document.getElementById('partner-email');
  partnerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(partnerEmail.value.trim())) {
      if (REGISTER_ENDPOINT) {
        fetch(REGISTER_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams({ email: partnerEmail.value.trim(), source: 'homepage' })
        }).catch(() => {});
      }
      const done = document.createElement('p');
      done.className = 'confirmation';
      done.textContent = 'Thank you. We will be in touch.';
      partnerForm.replaceWith(done);
    } else {
      partnerEmail.classList.remove('shake');
      void partnerEmail.offsetWidth;
      partnerEmail.classList.add('shake');
      partnerEmail.focus();
    }
  });
</script>
</body>
</html>
